[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+.
  NODE_VERSION = "22"

# Single-page app: every route (/student/mobile, /admin/web/…) is handled by
# React Router in the browser, so serve index.html for any path that isn't a
# real file. Without this, opening or refreshing a deep link 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
